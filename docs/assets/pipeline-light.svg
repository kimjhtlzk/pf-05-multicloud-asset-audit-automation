<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 274" width="1100" height="274" role="img" aria-label="Three clouds pass through role-based access and seven collectors into one schema, then to sheets, CSV, alerts, and a monthly archive."><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.wire{stroke-dasharray:6 7;animation:wire 1.1s linear infinite}@keyframes wire{to{stroke-dashoffset:-26}}@keyframes glow{0%,70%,100%{stroke:#D6D8E0}20%,45%{stroke:#00A862}}.c0{animation:glow 6.0s linear 0.0s infinite}.c1{animation:glow 6.0s linear 1.2s infinite}.c2{animation:glow 6.0s linear 2.4s infinite}.c3{animation:glow 6.0s linear 3.6s infinite}.c4{animation:glow 6.0s linear 4.8s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1100" height="274" rx="14" fill="#FFFFFF"/><path class="wire" d="M194 77C219 77 219 137 244 137" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M194 137C219 137 219 137 244 137" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M194 197C219 197 219 137 244 137" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M414 137C440 137 440 137 465 137" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M635 137C660 137 660 137 686 137" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M856 137C881 137 881 47 906 47" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M856 137C881 137 881 107 906 107" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M856 137C881 137 881 167 906 167" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><path class="wire" d="M856 137C881 137 881 227 906 227" fill="none" stroke="#00A862" stroke-opacity=".55" stroke-width="1.5"/><rect class="c0" x="24" y="54" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="109" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">AWS</text><text x="109" y="91" text-anchor="middle" font-size="10.5" fill="#555868">CloudTrail, boto3</text><rect class="c0" x="24" y="114" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="109" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">GCP</text><text x="109" y="151" text-anchor="middle" font-size="10.5" fill="#555868">Cloud Logging, SDK</text><rect class="c0" x="24" y="174" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="109" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">Tencent</text><text x="109" y="211" text-anchor="middle" font-size="10.5" fill="#555868">CloudAudit, SDK</text><rect class="c1" x="244" y="114" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="330" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">Assume role</text><text x="330" y="151" text-anchor="middle" font-size="10.5" fill="#555868">no stored keys</text><rect class="c2" x="465" y="114" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="550" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">Collectors</text><text x="550" y="151" text-anchor="middle" font-size="10.5" fill="#555868">7 resource types</text><rect class="c3" x="686" y="114" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6D8E0" stroke-width="1.5"/><text x="770" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#14141F">Common schema</text><text x="770" y="151" text-anchor="middle" font-size="10.5" fill="#555868">7 dataclasses</text><rect class="c4" x="906" y="24" width="170" height="46" rx="9" fill="#F4F5F8" stroke="#D6